apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.devtools.ksp'
apply plugin: "androidx.navigation.safeargs.kotlin"
android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.nyasai.traintimer"
        minSdkVersion 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Enables data binding.
    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig = true
    }

    kotlin {

    }

    repositories {
        google()
        mavenCentral()
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
        unitTests {
            includeAndroidResources = true
        }
    }

    
    namespace 'com.nyasai.traintimer'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // Support libraries
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // Android KTX
    implementation 'androidx.core:core-ktx:1.16.0'

    // Room and Lifecycle dependencies
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.fragment:fragment:1.8.8'
    ksp 'androidx.room:room-compiler:2.7.2'
    
    // Modern lifecycle dependencies
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.databinding:databinding-ktx:8.12.0'
    implementation 'androidx.databinding:databinding-runtime:8.12.0'

    // Navigation
    implementation('androidx.navigation:navigation-fragment-ktx:2.9.3')
    implementation('androidx.navigation:navigation-ui-ktx:2.9.3')


    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testImplementation 'io.mockk:mockk:1.14.5'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.0.0'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'org.mockito:mockito-inline:5.2.0'


    // HTTP
    implementation 'org.jsoup:jsoup:1.21.1'
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1'

    // setting
    implementation 'androidx.preference:preference-ktx:1.2.1'
}